<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lovable React Agile Blueprint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tab-active { border-color: #0d9488; color: #0d9488; font-weight: 600; }
    .tab-inactive { border-color: transparent; color: #6b7280; }
    .content-section { display: none; }
    .content-section.active { display: block; }
    .card-flip { transform-style: preserve-3d; transition: transform 0.7s; }
    .card-flipper.flipped .card-flip { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }
    .chart-container { position: relative; width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; height: 300px; max-height: 400px; }
    @media (min-width: 768px) { .chart-container { height: 350px; } }
  </style>
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="root"></div>
  <script type="module" src="../src/main.jsx"></script>
</body>
</html>
