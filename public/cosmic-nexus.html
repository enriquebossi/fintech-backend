<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-chartjs-2@5.3.0/dist/react-chartjs-2.umd.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .active-nav { color: #0d9488; font-weight: 600; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { Line } = ReactChartjs2;

    function CosmicNexusApp() {
      const sections = [
        { id: 'scope', title: 'Scope' },
        { id: 'flow', title: 'Flow' },
        { id: 'implementation', title: 'Implementation' },
        { id: 'launch', title: 'Launch' },
        { id: 'roadmap', title: 'Roadmap' },
        { id: 'faq', title: 'FAQ' },
      ];
      const refs = useRef({});
      const [active, setActive] = useState('scope');
      const [flowItem, setFlowItem] = useState(null);

      useEffect(() => {
        const onScroll = () => {
          const offset = window.innerHeight / 2;
          const scrollPos = window.scrollY + offset;
          const current = sections.reduce((acc, s) => {
            const el = refs.current[s.id];
            if (!el) return acc;
            const diff = Math.abs(scrollPos - el.offsetTop);
            return diff < acc.diff ? { id: s.id, diff } : acc;
          }, { id: active, diff: Infinity });
          setActive(current.id);
        };
        window.addEventListener('scroll', onScroll);
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const scrollTo = id => {
        const el = refs.current[id];
        if (el) { el.scrollIntoView({behavior: 'smooth'}); }
        setActive(id);
      };

      const chartData = {
        labels: ['Q1','Q2','Q3','Q4'],
        datasets: [{
          label: 'Milestones',
          data: [1,2,3,4],
          borderColor: '#0d9488',
          backgroundColor: 'rgba(13,148,136,0.2)'
        }]
      };

      const chartOptions = { responsive: true, maintainAspectRatio: false };

      const flowItems = [
        { id: 'discover', title: 'Discover', info: 'Gather requirements and understand user needs.' },
        { id: 'design', title: 'Design', info: 'Outline architecture and create prototypes.' },
        { id: 'develop', title: 'Develop', info: 'Iteratively build the solution with tests.' },
        { id: 'deploy', title: 'Deploy', info: 'Release and monitor in production.' },
      ];

      return (
        <div className="mx-auto max-w-3xl p-4">
          <header className="mb-8 text-center">
            <h1 className="text-3xl font-bold text-teal-700">Cosmic Nexus</h1>
          </header>
          <nav className="mb-6 flex justify-center space-x-4 text-sm font-medium">
            {sections.map(s => (
              <button
                key={s.id}
                onClick={() => scrollTo(s.id)}
                className={active === s.id ? 'active-nav' : 'text-stone-600'}
              >
                {s.title}
              </button>
            ))}
          </nav>
          <main className="space-y-16">
            {sections.map(s => (
              <section
                key={s.id}
                id={s.id}
                ref={el => refs.current[s.id] = el}
                className="scroll-mt-20"
              >
                <h2 className="text-2xl font-semibold mb-2" id={`h2-${s.id}`}>{s.title}</h2>
                {s.id === 'flow' && (
                  <>
                    <div className="flex flex-wrap gap-4" aria-label="Process steps">
                      {flowItems.map(item => (
                        <button
                          key={item.id}
                          tabIndex="0"
                          aria-describedby="flow-details"
                          onMouseEnter={() => setFlowItem(item)}
                          onMouseLeave={() => setFlowItem(null)}
                          onFocus={() => setFlowItem(item)}
                          onBlur={() => setFlowItem(null)}
                          onKeyDown={e => (e.key === 'Enter' || e.key === ' ') && setFlowItem(item)}
                          className="p-4 bg-white text-slate-800 border border-stone-300 rounded-lg shadow-sm hover:bg-teal-50 focus:outline-none focus:ring-2 focus:ring-teal-700"
                        >
                          {item.title}
                        </button>
                      ))}
                    </div>
                    <div id="flow-details" role="region" className="mt-4 text-slate-700 min-h-[3rem]">
                      {flowItem ? <p>{flowItem.info}</p> : <p className="text-slate-500">Focus a step to see details</p>}
                    </div>
                  </>
                )}
                {s.id === 'roadmap' && (
                  <div className="h-64"><Line data={chartData} options={chartOptions} /></div>
                )}
                {s.id !== 'flow' && s.id !== 'roadmap' && (
                  <p className="text-stone-700">Content for {s.title} goes here.</p>
                )}
              </section>
            ))}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CosmicNexusApp />);
  </script>
</body>
</html>
